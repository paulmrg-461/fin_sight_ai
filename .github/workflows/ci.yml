name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Analyze and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate DI
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify generated files are committed
        run: git diff --exit-code -- lib/core/di/injection.config.dart lib/l10n

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test --coverage

      - name: Coverage gate (domain/data >= 90%)
        run: dart run tool/check_coverage.dart

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  schema:
    name: Supabase migrations and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations and run RLS against Postgres 16
        run: ./supabase/validate_local.sh

  release-apk:
    name: Release APK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK with placeholder defines
        run: |
          flutter build apk --release \
            --dart-define-from-file=example.env

  integration:
    name: Integration tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev xvfb

      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate DI
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Integration tests
        run: xvfb-run -a flutter test -d linux integration_test/app_flow_test.dart
